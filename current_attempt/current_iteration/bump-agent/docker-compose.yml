# Supervisor (needs OC_KEY): docker compose --profile supervisor up -d
#
# The dashboard is a reader: no docker socket. Bind is localhost — Compose otherwise
# publishes 0.0.0.0 and that bypasses the host firewall.
# Source: https://docs.docker.com/reference/compose-file/services/#ports
name: bjv

services:
  dashboard:
    image: ${BJV_IMAGE:-vasiliymikhailov/bjv-agent:latest}
    build: .
    container_name: bjv-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      BJV_DASH_TOKEN: ${BJV_DASH_TOKEN:?set BJV_DASH_TOKEN in .env}
    volumes:
      - ${BJV_RESULTS:-./results}:/results
    command: ["tech.mikhailov.bjv.agent.Dashboard", "/results", "8086"]

  supervisor:
    profiles: ["supervisor"]
    image: ${BJV_IMAGE:-vasiliymikhailov/bjv-agent:latest}
    build: .
    container_name: bjv-supervisor
    restart: unless-stopped
    env_file: .env
    environment:
      OC_KEY: ${OC_KEY:-}
      OC_BASE: ${OC_BASE:-}
      OC_MODEL: ${OC_MODEL:-}
      BJV_SUPERVISOR_MINUTES: ${BJV_SUPERVISOR_MINUTES:-20}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BJV_RESULTS:-./results}:/results
    command: ["tech.mikhailov.bjv.agent.Supervisor", "/results"]
    depends_on:
      - dashboard
